name: Telegram smoke test

# Manual trigger only — Telegram channel sanity check（B-P6 task 10.4）
# 每月跑一次或在改 daily-check Telegram 部分後 manual 跑驗證。

# v2.33.66 round 16 HIGH-1: minimal default permissions
permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # 每月 1 日 UTC 22:00 = 台灣 06:00 跑一次 sanity
    - cron: '0 22 1 * *'

jobs:
  smoke:
    # 搬到 agent 專案後先停用：需先在本 repo 設好 secrets 並把 repo variable AGENT_WORKFLOWS_ENABLED 設為 true（Phase B）
    if: ${{ vars.AGENT_WORKFLOWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # v2.33.66 round 16 LOW-1: pin SHA
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Run Telegram smoke test
        run: bash scripts/telegram-smoke.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_BOT_HOME_TOKEN: ${{ secrets.TELEGRAM_BOT_HOME_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_SHA: ${{ github.sha }}
